    <!-- Carga async (no bloquea el render): pide el CSS con prioridad baja
         vía preload y recién lo activa como stylesheet cuando llega. El
         texto usa la fuente del sistema hasta entonces (font-display:swap
         en la URL ya cubre el cambio sin flash de contenido invisible). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
