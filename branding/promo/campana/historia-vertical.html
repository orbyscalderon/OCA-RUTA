<!doctype html>
<html lang="es">
<head><meta charset="utf-8">
<style>
  :root{--blue:#2563EB;--indigo:#1E3A8A;--gold:#FBBF24;--ink:#0F172A;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .wrap{width:1080px;height:1920px;background:var(--indigo);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px;}
  svg{width:220px;height:220px;}
  .brand{margin-top:24px;font-size:70px;font-weight:800;color:#fff;}
  .headline{margin-top:56px;font-size:60px;font-weight:800;color:#fff;line-height:1.25;max-width:820px;}
  .headline span{color:var(--gold);}
  .sub{margin-top:32px;font-size:32px;color:rgba(255,255,255,.85);font-weight:500;max-width:760px;line-height:1.5;}
  .plans{display:flex;gap:26px;margin:64px 0;}
  .plan-badge{width:120px;height:120px;border-radius:28px;background:var(--blue);display:flex;align-items:center;justify-content:center;gap:7px;}
  .bar{width:15px;border-radius:4px;}
  .cta{background:#fff;color:var(--ink);font-weight:800;font-size:32px;padding:24px 44px;border-radius:16px;display:flex;align-items:center;gap:16px;}
</style>
</head>
<body>
<div class="wrap">
  <svg viewBox="0 0 150 150"><circle cx="26" cy="90" r="9" fill="#FFFFFF"/><path d="M26,90 C26,40 74,40 82,68 C90,96 122,96 124,56" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/><circle cx="124" cy="52" r="22" fill="#FFFFFF"/><circle cx="124" cy="52" r="8" fill="#1D4ED8"/></svg>
  <div class="brand">OCA Ruta</div>
  <div class="headline">Tu negocio de <span>préstamos</span>, bajo control total</div>
  <div class="sub">App para cobradores + panel web para el dueño. Cajas, mora y reportes en tiempo real.</div>
  <div class="plans">
    <div class="plan-badge"><div class="bar" style="height:16px;background:#fff;"></div><div class="bar" style="height:26px;background:#fff;opacity:.3;"></div><div class="bar" style="height:36px;background:#fff;opacity:.3;"></div></div>
    <div class="plan-badge"><div class="bar" style="height:16px;background:#fff;"></div><div class="bar" style="height:26px;background:#fff;"></div><div class="bar" style="height:36px;background:#fff;opacity:.3;"></div></div>
    <div class="plan-badge"><div class="bar" style="height:16px;background:#FBBF24;"></div><div class="bar" style="height:26px;background:#FBBF24;"></div><div class="bar" style="height:36px;background:#FBBF24;"></div></div>
  </div>
  <div class="cta">▶ Prueba gratis 7 días</div>
</div>
</body></html>
